# XcodeGen spec — `brew install xcodegen && xcodegen generate`
#
# Keeps the Xcode project generated rather than committed, so there is no
# .pbxproj to merge-conflict over and the whole project is reconstructible from
# this file plus the sources. Pard can also just build the target by hand in
# Xcode; nothing here is load-bearing beyond the settings block.

name: OptiListen
options:
  bundleIdPrefix: com.longskymedia
  deploymentTarget:
    iOS: "17.0"     # See Docs/COMPLIANCE.md — 1.1 shipped at iOS 11, which
                    # Xcode 26 no longer supports. Confirmed against App
                    # Analytics 2026-09-07: every download since 2024 is iOS 17+.
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "YZ4B34YGX9"    # Christian Crumlish; confirmed owner of com.longskymedia.optilisten
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OptiListen:
    type: application
    platform: iOS
    sources:
      - path: OptiListen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longskymedia.optilisten   # matches the existing
                                                        # App Store record — do
                                                        # not change, the listing
                                                        # is tied to it
        # INFOPLIST_KEY_* settings REMOVED 2026-09-11 (Pard): they inject only into GENERATED
        # Info.plists, and this project declares an explicit one (info.path below) — so every one
        # of them was silently absent from the built bundle. Apple's validator caught orientations
        # (90474) and launch screen (90475); the missing mic-usage string would have been a crash
        # on first mic access in TestFlight. All now declared under info.properties, the one place
        # that actually lands. Do not reintroduce INFOPLIST_KEY_ lines while info.path exists.
        # Deliberately absent: UIBackgroundModes.
        # OptiListen 1.x shipped a 30-second background ceiling, raised it to 50,
        # and was rejected by Apple in July 2023 over the background-mode
        # changes. 2.0 does not run in the background. The phone is an
        # instrument you set on the desk with the screen on.
        ITSAppUsesNonExemptEncryption: NO
        # Icon: single-size 1024 catalog (Xcode generates all sizes incl. iPad 152). The PNG is the
        # ORIGINAL 1.x App Store icon, recovered 2026-09-11 from Apple's own artwork CDN via the
        # iTunes lookup API -- the 2.0 rebuild had no asset catalog at all (validator 90023).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OptiListen/Support/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        # Without these two, xcodegen writes CFBundleShortVersionString=1.0 / CFBundleVersion=1
        # into Info.plist and the plist WINS over MARKETING_VERSION/CURRENT_PROJECT_VERSION in the
        # build settings. Caught 2026-09-10: the first archive carried 1.0 while the App Store has
        # 1.3 — an upload-time rejection, invisible at compile. (Pard)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same class as the version bug above, caught by Apple's validator at upload (90474,
        # 2026-09-11): INFOPLIST_KEY_UISupportedInterfaceOrientations in the settings block only
        # injects into GENERATED Info.plists — this project has an explicit one, so the key never
        # reached the bundle and the IPA shipped with no orientations at all. Declared here, where
        # it actually lands. iPad lists all four because Apple requires full orientation support
        # for iPad multitasking (the alternative is UIRequiresFullScreen, a worse trade). (Pard)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: OptiListen
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "OptiListen listens to the room to estimate how much of a conversation you spend talking. Audio is analyzed on your device as loudness only — nothing is recorded, transcribed, or sent anywhere."
